@font-face{
  font-family:"DnR OPPOSans";
  src:local("OPPOSans-R"),local("OPPOSans R"),local("OPPOSans-Regular"),local("OPPO Sans Regular");
  font-style:normal;font-weight:400;
}
@font-face{
  font-family:"DnR OPPOSans";
  src:local("OPPOSans-M"),local("OPPOSans M"),local("OPPOSans-Medium"),local("OPPO Sans Medium");
  font-style:normal;font-weight:500;
}
@font-face{
  font-family:"DnR OPPOSans";

  font-style:normal;font-weight:700;
}
@font-face{
  font-family:"DnR PingFang SC";
  src:local("PingFangSC-Regular"),local("PingFang SC Regular");
  font-style:normal;font-weight:400;
}
@font-face{
  font-family:"DnR PingFang SC";
  src:local("PingFangSC-Medium"),local("PingFang SC Medium");
  font-style:normal;font-weight:500;
}
@font-face{
  font-family:"DnR PingFang SC";
  src:local("PingFangSC-Semibold"),local("PingFang SC Semibold"),local("PingFangSC-Bold"),local("PingFang SC Bold");
  font-style:normal;font-weight:600;
}
@font-face{

}
/* ───────── 设计令牌：全局唯一来源，新元素只允许复用这些值 ───────── */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r1:4px; --r2:8px;
  --f1:12px; --f2:14px; --f3:16px; --f4:20px;
  --ease:cubic-bezier(.2,.8,.2,1); --d1:120ms; --d2:200ms;
  --sans:"DnR OPPOSans","OPPOSans","OPPO Sans","DnR PingFang SC","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,"Microsoft YaHei",sans-serif;
  --mono:"DnR OPPOSans","OPPOSans","OPPO Sans","DnR PingFang SC","PingFang SC",ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono","Microsoft YaHei",monospace;
  --accent:#0B45E5; --add:#259462; --del:#D14A43;
}
html[data-theme="dark"]{
  --bg0:#19191A; --bg2:#313133;
  --shade:rgb(25 25 26 / .30);
  --fg1:#F5F5F2; --fg2:#A8A8A8;
  --accent-soft:rgb(11 69 229 / .30);
  --add-soft:rgb(67 217 141 / .08);
  --del-soft:rgb(255 107 107 / .08);
}
html[data-theme="light"]{
  --bg0:#F5F5F2; --bg2:#DBDBD9;
  --shade:rgb(25 25 26 / .15);
  --fg1:#19191A; --fg2:#757575;
  --accent-soft:rgb(11 69 229 / .15);
  --add-soft:rgb(67 217 141 / .15);
  --del-soft:rgb(255 107 107 / .15);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg0);color:var(--fg1);
  font:400 var(--f2)/1.5 var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.app{height:100vh;display:grid;grid-template-rows:56px 44px 1fr}

/* ───────── 命令条 ───────── */
.bar{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);border-bottom:1px solid var(--bg2)}
.brand{display:flex;align-items:center;gap:var(--s2);width:220px;flex:none}
.mark{width:24px;height:24px;display:grid;place-items:center;flex:none}
.brand-name{font-size:var(--f3);font-weight:600;letter-spacing:-.01em}

.score{flex:1;display:flex;align-items:baseline;justify-content:center;gap:var(--s3);min-width:0}
.s-num{font-size:var(--f4);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.s-num.add{color:var(--add)} .s-num.del{color:var(--del)}
.s-same{display:flex;align-items:center;gap:var(--s2);font-size:var(--f2);font-weight:500;color:var(--add)}
.s-same::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--add)}
.s-hint{font-size:var(--f2);color:var(--fg2)}
.score[data-state="diff"] .s-same,.score[data-state="diff"] .s-hint{display:none}
.score[data-state="same"] .s-nums,.score[data-state="same"] .s-hint{display:none}
.score[data-state="empty"] .s-nums,.score[data-state="empty"] .s-same{display:none}
.s-nums{display:flex;align-items:baseline;gap:var(--s3)}

.actions{width:220px;flex:none;display:flex;justify-content:flex-end;gap:var(--s1)}
.ibtn{
  width:30px;height:30px;border-radius:var(--r1);color:var(--fg2);
  display:grid;place-items:center;transition:background var(--d1) var(--ease),color var(--d1) var(--ease);
}
.ibtn:hover{background:var(--bg2);color:var(--fg1)}
.ibtn:active{transform:scale(.94)}
.ibtn>svg,.icon{width:15px;height:15px;display:block;flex:none}
html[data-theme="dark"] .i-sun{display:block} html[data-theme="dark"] .i-moon{display:none}
html[data-theme="light"] .i-sun{display:none} html[data-theme="light"] .i-moon{display:block}

/* ───────── 版本历史浮层 ───────── */
.history-scrim{position:fixed;inset:0;z-index:20;background:var(--shade);opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease)}
.history-scrim.is-open{opacity:1;pointer-events:auto}
.history-drawer{
  position:fixed;top:12px;right:12px;bottom:12px;width:min(360px,calc(100vw - 24px));
  z-index:21;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg0);border:1px solid var(--bg2);border-radius:var(--r2);
  box-shadow:0 18px 60px var(--shade);transform:translateX(calc(100% + 24px));visibility:hidden;
  transition:transform var(--d2) var(--ease),visibility 0s linear var(--d2)
}
.history-drawer.is-open{transform:translateX(0);visibility:visible;transition-delay:0s}
.history-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3) var(--s3) var(--s4);border-bottom:1px solid var(--bg2);flex:none}
.history-head-copy{min-width:0;flex:1}
.history-title{font-size:var(--f3);font-weight:600}
.history-subtitle{margin-top:2px;font-size:var(--f1);color:var(--fg2)}
.history-close{flex:none}
.history-list{min-height:0;overflow-y:auto;padding:var(--s2);scrollbar-width:thin;scrollbar-color:var(--bg2) transparent}
.history-list::-webkit-scrollbar{width:10px}
.history-list::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
.history-row{display:block;width:100%;padding:var(--s3);margin:0 0 var(--s1);border:1px solid transparent;border-radius:var(--r1);text-align:left;color:var(--fg1);background:transparent;cursor:pointer}
.history-row:hover{background:var(--bg2)}
.history-row.is-current{background:var(--accent-soft);border-color:var(--bg2)}
.history-row-top{display:flex;align-items:center;gap:var(--s2);min-width:0}
.history-row-title{font-size:var(--f2);font-weight:500;white-space:nowrap}
.history-row-current{font-size:var(--f1);color:var(--fg1);white-space:nowrap}
.history-row-time{margin-left:auto;font-size:var(--f1);color:var(--fg2);white-space:nowrap}
.history-row-summary{display:block;margin-top:var(--s1);font-size:var(--f1);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-empty{padding:var(--s5) var(--s3);font-size:var(--f2);color:var(--fg2);text-align:center}
.history-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s2) var(--s3);border-top:1px solid var(--bg2);flex:none}
.history-foot-note{font-size:var(--f1);color:var(--fg2)}
.history-foot .history-purge,.history-foot .history-purge:hover{color:var(--del)}

/* ───────── 清空确认 ───────── */
.confirm-layer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:var(--s4);background:var(--shade)}
.confirm-layer[hidden]{display:none}
.confirm-card{width:min(420px,100%);padding:var(--s5);background:var(--bg0);border:1px solid var(--bg2);border-radius:var(--r2);box-shadow:0 20px 70px var(--shade)}
.confirm-main{display:flex;gap:var(--s3);align-items:flex-start}
.confirm-icon{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:var(--r1);color:var(--del);background:var(--del-soft)}
.confirm-title{font-size:var(--f3);font-weight:600}
.confirm-text{margin:var(--s2) 0 0;color:var(--fg2);font-size:var(--f2);line-height:1.65}
.confirm-actions{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s5)}
.confirm-actions .ghost{height:30px;padding:0 var(--s3);background:var(--bg2);color:var(--fg1)}
.danger-btn{height:30px;padding:0 var(--s3);border-radius:var(--r1);font-size:var(--f2);color:var(--del);background:var(--del-soft);transition:opacity var(--d1) var(--ease)}
.danger-btn:hover{opacity:.78}

/* ───────── 选项轨 ───────── */
.rail{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:0 var(--s4);border-bottom:1px solid var(--bg2)}
.chips{display:flex;gap:var(--s1);flex-wrap:nowrap;min-width:0;overflow:hidden}
.chip{
  display:flex;align-items:center;gap:var(--s2);white-space:nowrap;
  height:28px;padding:0 var(--s2) 0 10px;border-radius:var(--r1);
  font-size:var(--f2);color:var(--fg2);
  transition:background var(--d1) var(--ease),color var(--d1) var(--ease);
}
.chip:hover{background:var(--bg2);color:var(--fg1)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg1)}
.chip-icon{width:15px;height:15px;display:block;flex:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.rail-meta{font-size:var(--f1);color:var(--fg2);white-space:nowrap;min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rail-meta.is-warning{color:var(--del)}

/* ───────── 工作台 ───────── */
.stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr) 1px minmax(0,1fr);min-height:0}
.divider{background:var(--bg2)}
.sweep{position:absolute;inset:0 0 auto 0;height:1px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.sweep.on{animation:sweep 420ms var(--ease)}
@keyframes sweep{0%{opacity:0;transform:scaleX(.2)}45%{opacity:.75}100%{opacity:0;transform:scaleX(1)}}

.pane{display:grid;grid-template-rows:38px 1fr;min-width:0;min-height:0}
.pane-head{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4) 0 var(--s5);border-bottom:1px solid var(--bg2)}
.pane-title{font-size:var(--f2);font-weight:500}
.pane-meta{font-size:var(--f1);color:var(--fg2);font-variant-numeric:tabular-nums}
.pane-tools{margin-left:auto;display:flex;gap:var(--s1)}
.ghost{
  display:flex;align-items:center;gap:var(--s1);height:24px;padding:0 var(--s2);
  border-radius:var(--r1);font-size:var(--f1);color:var(--fg2);
  transition:background var(--d1) var(--ease),color var(--d1) var(--ease);
}
.ghost:hover{background:var(--bg2);color:var(--fg1)}
.ghost.done{color:var(--add)}
.ghost.icon-only{width:24px;padding:0;justify-content:center}

.editor{position:relative;min-height:0;overflow:hidden}
.hl,.ta{
  position:absolute;inset:0;margin:0;
  padding:var(--s4) var(--s3) var(--s5) var(--s5);
  font:400 var(--f2)/1.75 var(--mono);
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;
  border:0;background:transparent;tab-size:4;overflow-x:hidden;overflow-y:scroll;
  scrollbar-width:thin;scrollbar-color:var(--bg2) transparent;
}
.hl{color:var(--fg1);pointer-events:none;z-index:0}
.ta{
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--accent);
  resize:none;outline:0;z-index:1;overflow-anchor:none;
}
.ta::selection{background:var(--accent-soft)}
.ta::-webkit-scrollbar,.hl::-webkit-scrollbar{width:10px}
.ta::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
.hl::-webkit-scrollbar-thumb{background:transparent}

.pane-l .m-hit{background:var(--del-soft);color:var(--del);text-decoration:line-through;
  text-decoration-color:var(--del);text-decoration-thickness:1px;border-radius:2px}
.pane-r .m-hit{background:var(--add-soft);color:var(--add);border-radius:2px}
.pane-c .m-c-a{background:var(--del-soft);color:var(--del);border-radius:2px}
.pane-c .m-c-b{background:var(--add-soft);color:var(--add);border-radius:2px}
.pane-c .m-c-both{color:var(--fg1);background:var(--accent-soft);border-radius:2px}

.empty{
  position:absolute;left:0;right:0;top:38%;display:flex;flex-direction:column;align-items:center;gap:var(--s3);
  pointer-events:none;transition:opacity var(--d2) var(--ease)
}
.empty[hidden]{display:none}
.empty-text{font-size:var(--f2);color:var(--fg2)}
@media (max-width:900px){.brand,.actions{width:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (forced-colors:active){button:focus-visible{box-shadow:none;outline:2px solid Highlight;outline-offset:-2px}}
</style>
</head>

  }
  $('chips').addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (chip) { toggleOpt(chip.getAttribute('data-opt')); }
  });

  /* ── 复制 ── */
  function copy(ta, btn) {
    var text = ta.value;
    var done = function () {
      btn.classList.add('done');
      btn.setAttribute('aria-label', '已复制');
      btn.title = '已复制';
      setTimeout(function () {
        btn.classList.remove('done');
        btn.setAttribute('aria-label', '复制');
        btn.title = '复制';
      }, 1400);
    };
    if (!text) { return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(ta); done(); });
    } else { legacyCopy(ta); done(); }
  }
  function legacyCopy(ta) {
    var s = ta.selectionStart, e = ta.selectionEnd;
    ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    ta.setSelectionRange(s, e);
  }
  $('copyL').addEventListener('click', function () { copy(taL, $('copyL')); });
  $('copyR').addEventListener('click', function () { copy(taR, $('copyR')); });
  $('copyC').addEventListener('click', function () { copy(taC, $('copyC')); });

  /* ── 清空 + 撤销 ── */
  $('clearBtn').addEventListener('click', openClearConfirm);

  /* ── 快捷键 ── */
  document.addEventListener('keydown', function (e) {
    if (!clearConfirm.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeClearConfirm(); }
      else if (e.key === 'Tab') { trapTab(clearConfirm, e); }
      return;
    }
    if (historyDrawer.classList.contains('is-open')) {
      if (e.key === 'Escape') { e.preventDefault(); setHistoryOpen(false); }
      else if (e.key === 'Tab') { trapTab(historyDrawer, e); }
      return;
    }
    var mod = IS_MAC ? e.metaKey : e.ctrlKey;
    if (e.altKey && !mod && e.key >= '1' && e.key <= '4') {
      var names = ['ignoreLineBreaks', 'ignoreWhitespace', 'ignoreCase', 'ignorePunctuation'];
      e.preventDefault();
      toggleOpt(names[Number(e.key) - 1]);
      return;
    }
    if (!mod) { return; }
    var k = e.key.toLowerCase();
    if (k === '1') { e.preventDefault(); taL.focus(); }
    else if (k === '2') { e.preventDefault(); taR.focus(); }
    else if (k === '3') { e.preventDefault(); taC.focus(); }
    else if (k === 'z' && !e.shiftKey) {
      if (document.activeElement === taL || document.activeElement === taR || document.activeElement === taC) { return; }
      e.preventDefault(); undoVersion();
    }
    else if (k === 'd') { e.preventDefault(); $('themeBtn').click(); }
    else if (k === 'backspace' || k === 'delete') { e.preventDefault(); openClearConfirm(); }
    else if (k === 'c' && e.shiftKey) {
      e.preventDefault();
      if (document.activeElement === taR) { copy(taR, $('copyR')); }
      else if (document.activeElement === taC) { copy(taC, $('copyC')); }
      else { copy(taL, $('copyL')); }
    }
  });

  /* ── 首屏 ── */
  var restored = restoreCache();
  renderHistory();
  if (restored) { schedule(0); }
  else {
    updateMeta();
    paintPlain(hlL, ''); paintPlain(hlR, ''); paintPlain(hlC, '');
  }
  window.addEventListener('beforeunload', function () { flushVersion(); saveCache(); });
})();
</script>
</body>
</html>
